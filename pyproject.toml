[project]
name = "finances"
version = "0.1.0"
description = "Finances perso : collecte, analyse et alertes en lecture seule"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.0",
    "pyotp>=2.10.0",
    "python-multipart>=0.0.32",
    "regex>=2026.9.29",
    "sqlalchemy>=2.1.1",
    "tenacity>=9.1.4",
    "tzdata>=2026.4",
    "uvicorn>=0.54.0",
    "webauthn>=2",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.168.2",
    "mcp>=2.2.0",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pip-licenses>=5.5.5",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.9.0",
    "pytest-socket>=0.8.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.9",
    "soft-webauthn>=0.1.3",
    "types-pyyaml>=6.0.12.20260906",
    "types-regex>=2026.9.29.20261005",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config", "--disable-socket", "--allow-unix-socket"]
filterwarnings = ["error"]
markers = [
    "slow: tests longs (performance), lancés en CI",
    "e2e: tests de bout en bout dans un vrai navigateur (option --e2e)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Caractère typographique visible et voulu (fil d'Ariane des catégories).
allowed-confusables = ["›"]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # tri des imports
    "B",       # bugbear
    "UP",      # pyupgrade
    "S",       # bandit (sécurité)
    "DTZ",     # datetimes sans fuseau interdits (inv. 9)
    "PL",      # pylint
    "RUF",
]

[tool.ruff.lint.pylint]
max-args = 8
max-positional-args = 5

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
# Migrations générées puis relues : longues par nature.
"migrations/versions/**" = ["PLR0915"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests", "migrations", "scripts"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["ruff.*", "soft_webauthn"]  # soft_webauthn : clé logicielle des tests, sans types
ignore_missing_imports = true
