name: image

# Workflow réutilisable, appelé par ci.yml uniquement après les contrôles verts :
# aucune image n'est publiée sans tests, typage et gitleaks au vert.
on:
  workflow_call:

permissions:
  contents: read

env:
  # Paquet propre au dépôt public (l'ancien « finances » reste rattaché au dépôt d'origine).
  IMAGE: ghcr.io/${{ github.repository }}-app

jobs:
  smoke:
    name: build amd64 et test de fumée
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: finances:smoke
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
      - name: Vulnérabilités de l'image (Trivy, hautes et critiques corrigibles)
        env:
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          TRIVY_VERSION: "0.75.0"
        run: |
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " ${archive}\$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "${archive}" trivy
          ./trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress finances:smoke
      - name: Taille de l'image (< 200 Mo)
        run: |
          size=$(docker image inspect finances:smoke --format '{{.Size}}')
          echo "taille : $((size / 1024 / 1024)) Mo"
          test "$size" -lt $((200 * 1024 * 1024))
      - name: Utilisateur non root
        run: test "$(docker run --rm finances:smoke id -u)" = "10001"
      - name: Secrets factices (générés, jamais versionnés)
        run: |
          dir="$RUNNER_TEMP/secrets"
          mkdir -p "$dir"
          openssl rand -base64 48 | tr -d '\n' > "$dir/app_secret_key"
          openssl rand -base64 32 | tr -d '\n' > "$dir/data_encryption_key"
          openssl rand -base64 32 | tr -d '\n' > "$dir/blind_index_key"
          chmod 0444 "$dir"/*
      - name: Migrations applicables dans l'image
        run: docker run --rm -e FINANCES_DATABASE_PATH=/tmp/smoke.db finances:smoke alembic upgrade head
      - name: Conteneur web sain
        run: |
          docker run -d --name web -p 127.0.0.1:8000:8000 \
            -e FINANCES_DATABASE_PATH=/tmp/web.db \
            -v "$RUNNER_TEMP/secrets:/run/secrets:ro" finances:smoke
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' web)
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker logs web
          test "$status" = healthy
          curl -fsS http://127.0.0.1:8000/health
      - name: Worker démarre et s'arrête proprement
        run: |
          docker run -d --name worker -e FINANCES_DATABASE_PATH=/tmp/worker.db \
            -v "$RUNNER_TEMP/secrets:/run/secrets:ro" finances:smoke \
            sh -c 'alembic upgrade head && exec python -m app.ops.worker'
          sleep 3
          docker stop -t 10 worker
          docker logs worker 2>&1 | tee worker.log
          grep -q "arrêté proprement" worker.log
      - name: Pile compose complète (migrate, web, worker, ntfy)
        env:
          FINANCES_IMAGE: finances:smoke
          FINANCES_DATA_DIR: ${{ runner.temp }}/data
          FINANCES_SECRETS_DIR: ${{ runner.temp }}/secrets
          FINANCES_NTFY_DIR: ${{ runner.temp }}/ntfy
        run: |
          docker rm -f web worker
          mkdir -p "$FINANCES_DATA_DIR" "$FINANCES_SECRETS_DIR" "$FINANCES_NTFY_DIR"
          sudo chown 10001:10001 "$FINANCES_DATA_DIR"
          sudo chown 10002:10002 "$FINANCES_NTFY_DIR"
          compose=(docker compose -f deploy/compose.yml)
          "${compose[@]}" up -d
          for _ in $(seq 1 45); do
            web=$(docker inspect -f '{{.State.Health.Status}}' "$("${compose[@]}" ps -q web)" 2>/dev/null || true)
            ntfy=$(docker inspect -f '{{.State.Health.Status}}' "$("${compose[@]}" ps -q ntfy)" 2>/dev/null || true)
            [ "$web" = healthy ] && [ "$ntfy" != starting ] && break
            sleep 2
          done
          "${compose[@]}" ps -a
          "${compose[@]}" logs --no-color
          test "$web" = healthy
          test "$("${compose[@]}" ps -a --format '{{.ExitCode}}' migrate)" = 0
          test -f "$FINANCES_DATA_DIR/finances.db"
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8080/v1/health
          exposed=$(ss -tlnH | awk '{print $4}' | grep -E ':(8000|8080)$' | grep -vE '^(127\.0\.0\.1|\[::1\]):' || true)
          if [ -n "$exposed" ]; then echo "port exposé hors localhost : $exposed"; exit 1; fi
          "${compose[@]}" down

  publish:
    name: build multi-arch et publication GHCR
    if: github.event_name == 'push'
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Nom d'image en minuscules (exigé par GHCR)
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=multi
          cache-to: type=gha,mode=max,scope=multi
      - name: Vérifier la présence de linux/arm64
        run: docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA::7}" | tee manifest.txt && grep -q "linux/arm64" manifest.txt
