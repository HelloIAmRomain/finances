# Règles gitleaks du projet (inv. 5) : règles par défaut + IBAN.
title = "finances"

[extend]
useDefault = true

[[rules]]
id = "iban"
description = "IBAN (jamais d'IBAN réel dans le dépôt ; utiliser les IBAN fictifs des fixtures)"
regex = '''\b[A-Z]{2}\d{2}(?:[ ]?[0-9A-Z]{4}){3,7}(?:[ ]?[0-9A-Z]{1,3})?\b'''

# IBAN fictifs des tests : code banque 99999 (inexistant). Seuls ceux-là sont admis.
[[rules.allowlists]]
regexTarget = "match"
regexes = ['''^[A-Z]{2}\d{2}[ ]?9999[ ]?9''']
